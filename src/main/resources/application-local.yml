assistant:
  rootPath: Y:\

management:
  health:
    redis:
      enabled: false

logging:
  level:
    org.springdoc: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.data.redis: DEBUG
    org.springframework.cache: DEBUG
    org.springframework.data.redis.cache.RedisCache: TRACE
