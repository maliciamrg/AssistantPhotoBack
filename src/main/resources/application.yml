spring:
  application:
    name: AssistantPhoto
  data:
    redis:
      host: 192.212.10.200
      port: 6379
#      password: yourpassword  # Optional, if your Redis instance requires authentication
      timeout: 2000  # Optional timeout in milliseconds
  cache:
    type: redis
    redis:
      time-to-live: 600000  # TTL in milliseconds (e.g., 600000ms = 10 minutes)
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: baseline
    drop-first: false
  datasource:
    url: jdbc:postgresql://192.212.10.200:5432/photosdb
    username: photos_user
    password: photos_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false


application:
  version: "@project.version@"
  ipWan: '192.212.5.200'
  build_date: "@git.build.time@"
  commit_id: "@git.commit.id.abbrev@"
  redis:
    prefix: "photoassistant::"
server:
  port: 8099
springdoc:
  show-actuator: true

my:
  app:
    name: AssistantPhoto
    version: "1.0"

assistant:
  tagFileName: "AssistantPhoto_Tag.json"
  dryRun: true
  name: assistant
  rootPath: ./src/test/resources/
  fileExtensionsToWorkWith:
    - jpg
    - tif
    - tiff
    - dng
    - jpeg
    - arw
    - mp4
    - png
    - mts
    - mov
    - avi
    - m2ts
    - 3gp
    - m4v
    - mpg
    - psd
    - bmp
    - gif
    - tiff_original
  groupPhoto:
    ecartEnMinutes: 20
    photoMin: 5
  photoshootType:
    - photoshootTypeEnum: all_in
      photoshootRoot:
        - path: "00-CheckIn"
          description: "Main check-in folder"
    - photoshootTypeEnum: Assistant_Work
      photoshootRoot:
        - path: "10-Assistant_work"
          description: "Work folder for the Assistant"
    - photoshootTypeEnum: Rejet
      photoshootRoot:
        - path: "99-Rejet"
          description: "Rejected items"
    - photoshootTypeEnum: Sauvegarde
      photoshootRoot:
        - path: "50-Phototheque\\#Sauvegarde 999 j"
          description: "Backup photographs"
    - photoshootTypeEnum: Events
      photoshootRoot:
        - path: "50-Phototheque\\##Events 10-15 j"
          description: "Events photographs"
      uniteDeJour: 1
      nbMaxParUniteDeJour: 15
      ratioStarMin:
        - 1
        - 1
        - 0
        - 0
        - 0
      ratioStarMax:
        - 25
        - 12
        - 5
        - 2
        - 1
      zoneValeurAdmise:
        - £DATE£
        - "@00_EVENT@"
        - "@00_WHERE@"
        - "@00_WHAT@|@00_WHO@"
      rapprochementNewOk: true
    - photoshootTypeEnum: Holidays
      photoshootRoot:
        - path: "50-Phototheque\\##Holidays 20-30 sem"
          description: "Holiday photographs"
      uniteDeJour: 7
      nbMaxParUniteDeJour: 30
      ratioStarMin:
        - 1
        - 1
        - 0
        - 0
        - 0
      ratioStarMax:
        - 25
        - 12
        - 5
        - 2
        - 1
      zoneValeurAdmise:
        - £DATE£
        - "@00_EVENT@"
        - "@00_WHERE@"
        - "@00_WHAT@|@00_WHO@"
      rapprochementNewOk: true
    - photoshootTypeEnum: Shooting
      photoshootRoot:
        - path: "50-Phototheque\\##Shooting 03-05 j"
          description: "Shooting session photographs"
      uniteDeJour: 1
      nbMaxParUniteDeJour: 5
      ratioStarMin:
        - 1
        - 1
        - 0
        - 0
        - 0
      ratioStarMax:
        - 25
        - 12
        - 5
        - 2
        - 1
      zoneValeurAdmise:
        - £DATE£
        - "@00_PHOTOGRAPHY@"
        - "@00_WHERE@"
        - "@00_WHAT@|@00_WHO@"
      rapprochementNewOk: true
info:
  application:
    name: ${spring.application.name}
    version: ${application.version}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,openapi,swagger-ui,flyway
  info:
    build:
      enabled: true
    env:
      enabled: true
    git:
      enabled: true
      mode: full
    java:
      enabled: true
    os:
      enabled: true

