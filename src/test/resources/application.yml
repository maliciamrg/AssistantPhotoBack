spring:
  application:
    name: AssistantPhoto

application:
  version: "@project.version@"

assistant:
  dryRun: true
  name: assistant
  rootPath: ./src/test/resources/
  fileExtensionsToWorkWith:
    - jpg
    - tif
    - tiff
    - dng
    - jpeg
    - arw
    - mp4
    - png
    - mts
    - mov
    - avi
    - m2ts
    - 3gp
    - m4v
    - mpg
    - psd
    - bmp
    - gif
    - tiff_original
  groupPhoto:
    ecartEnMinutes: 20
    photoMin: 5
  photoshootType:
    - photoshootTypeEnum: all_in
      photoshootList:
        - path: "00-CheckIn"
          description: "Main check-in folder"
        - path: "00-CheckIn-2"
          description: "Main check-in folder 2"
    - photoshootTypeEnum: Assistant_Work
      photoshootList:
        - path: "10-Assistant_work"
          description: "Work folder for the Assistant"
    - photoshootTypeEnum: Rejet
      photoshootList:
        - path: "99-Rejet"
          description: "Rejected items"
    - photoshootTypeEnum: Sauvegarde
      photoshootList:
        - path: "50-Phototheque\\#Sauvegarde 999 j"
          description: "Backup photographs"
    - photoshootTypeEnum: Events
      photoshootList:
        - path: "50-Phototheque\\##Events 10-15 j"
          description: "Events photographs"
      uniteDeJour: 1
      nbMaxParUniteDeJour: 15
      ratioStarMin:
        - 1
        - 1
        - 0
        - 0
        - 0
      ratioStarMax:
        - 25
        - 12
        - 5
        - 2
        - 1
      zoneValeurAdmise:
        - £DATE£
        - "@00_EVENT@"
        - "@00_WHERE@"
        - "@00_WHAT@|@00_WHO@"
      rapprochementNewOk: true
    - photoshootTypeEnum: Holidays
      photoshootList:
        - path: "50-Phototheque\\##Holidays 20-30 sem"
          description: "Holiday photographs"
      uniteDeJour: 7
      nbMaxParUniteDeJour: 30
      ratioStarMin:
        - 1
        - 1
        - 0
        - 0
        - 0
      ratioStarMax:
        - 25
        - 12
        - 5
        - 2
        - 1
      zoneValeurAdmise:
        - £DATE£
        - "@00_EVENT@"
        - "@00_WHERE@"
        - "@00_WHAT@|@00_WHO@"
      rapprochementNewOk: true
    - photoshootTypeEnum: Shooting
      photoshootList:
        - path: "50-Phototheque\\##Shooting 03-05 j"
          description: "Shooting session photographs"
      uniteDeJour: 1
      nbMaxParUniteDeJour: 5
      ratioStarMin:
        - 1
        - 1
        - 0
        - 0
        - 0
      ratioStarMax:
        - 25
        - 12
        - 5
        - 2
        - 1
      zoneValeurAdmise:
        - £DATE£
        - "@00_PHOTOGRAPHY@"
        - "@00_WHERE@"
        - "@00_WHAT@|@00_WHO@"
      rapprochementNewOk: true
info:
  application:
    name: ${spring.application.name}
    version: ${application.version}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    build:
      enabled: true
    env:
      enabled: true
    git:
      enabled: true
      mode: full
    java:
      enabled: true
    os:
      enabled: true
